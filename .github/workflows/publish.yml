name: Publish to npm

on:
  push:
    branches: [main]
    paths-ignore:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run build

      - run: npm test

      - name: Check npm trusted publishing setup
        run: |
          echo "Using npm trusted publishing through GitHub OIDC."
          echo "npm version: $(npm --version)"
          echo "Make sure npm trusted publishing is configured for this repository and workflow file."

      - name: Bump beta version
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          CURRENT=$(node -p "require('./package.json').version")
          LATEST=$(npm view "$PACKAGE_NAME@beta" version 2>/dev/null || echo "$CURRENT")
          echo "Package: $PACKAGE_NAME"
          echo "Latest beta on npm: $LATEST"
          npm version "$LATEST" --no-git-tag-version --allow-same-version
          npm version prerelease --preid=beta --no-git-tag-version

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - run: npm publish --access public --tag beta --provenance

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.VERSION }}"
          git push origin "v${{ steps.version.outputs.VERSION }}"
